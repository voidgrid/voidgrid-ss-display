repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks-system  # uses the installed gitleaks (Fedora package)
        pass_filenames: false  # upstream gitleaks-system omits this; filenames make gitleaks exit with usage
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4
    hooks:
      - id: ruff-check  # lint and PEP 8 checks, configured in ruff.toml
